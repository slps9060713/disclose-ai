name: disclose-ai (self)
on:
  pull_request_target:
    types: [opened, synchronize, edited, reopened]
# edited and synchronize can fire in close succession (e.g. a contributor edits the description
# right after pushing); without this, two concurrent runs could both find no existing comment and
# each create one. cancel-in-progress means only the newest event's result is ever written.
concurrency:
  group: disclose-ai-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the BASE branch by default, never the PR head,
      # so `uses: ./` runs the already-merged, trusted copy of this action.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
