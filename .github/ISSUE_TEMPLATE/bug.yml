name: Bug report
description: Something broke
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: disclose-ai version, placeholder: "1.0.0 (npm) or v1 (action)" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include the action log or CLI output. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
  - type: textarea
    id: policy
    attributes: { label: Your ai-policy.yml, render: yaml }
